# configs/models.example.yaml — СИНТЕТИЧЕСКИЙ ПРИМЕР (не рабочий конфиг).
#
# Политика: см. configs/README.md и docs/privacy-and-safety.md §2.
# - Секретов в этом файле НЕТ. Поля api_key_env хранят только ИМЯ переменной
#   окружения; значение резолвится из окружения в рантайме.
# - Четыре задачи MVP настраиваются независимо; провайдер/модель могут отличаться.
# - transcription в MVP — только локальный faster_whisper;
#   normalization/summarization/wellbeing_analysis — только openai_compatible.
# - Четыре профиля слоёв фазы 2 (T02, T13b) — `diary_stt`, `diary_sum`,
#   `diary_week`, `diary_coach` — ОПЦИОНАЛЬНЫ: отсутствие профиля означает
#   «слой отключён», а не ошибку (docs/tasklist-phase2.md §9.8). Валидатор
#   принимает конфиг и без них.
#
# Как использовать: скопируйте файл в configs/models.yaml (в Git не
# коммитится) и задайте значения. Путь к рабочему файлу можно переопределить
# переменной окружения MODELS_CONFIG. Пример имен ключей — в .env.example.
#
# external: false — локальный эндпоинт (данные не покидают машину);
# external: true  — внешний сервис: содержимое дневника уходит наружу и
#                   требует явного включения и раскрытия в UI.

profiles:
  transcription:
    provider: faster_whisper      # локальный STT (MVP)
    model: small                  # имя/размер модели
    language: ru                  # язык распознавания
    device: cpu                   # cpu или cuda (опционально, WSL 2)
    compute_type: int8            # int8/int8_float16/int8_float32/float16/float32
    beam_size: 5

  normalization:
    provider: openai_compatible
    base_url: http://127.0.0.1:11434/v1   # локальный OpenAI-совместимый эндпоинт (пример)
    model: local-normalizer
    api_key_env: NORMALIZATION_API_KEY    # имя переменной окружения, НЕ значение
    timeout_s: 120
    temperature: 0.0
    max_tokens: 8000
    external: false

  summarization:
    provider: openai_compatible
    base_url: https://api.example.com/v1  # пример внешнего сервиса
    model: summary-model
    api_key_env: SUMMARIZATION_API_KEY
    timeout_s: 120
    temperature: 0.2
    max_tokens: 2000
    external: true                         # внешняя обработка: требует явного включения

  wellbeing_analysis:
    provider: openai_compatible
    base_url: http://127.0.0.1:11434/v1
    model: local-wellbeing
    api_key_env: WELLBEING_API_KEY
    timeout_s: 120
    temperature: 0.2
    max_tokens: 1500
    external: false

# --- Профили слоёв фазы 2 (T02/T13b, опциональные) ---------------------------
# Все — локальный Ollama по OpenAI-совместимому API. GPU-теги создаются
# `scripts/serve-ollama.sh create-phase2` из парных Modelfile
# (ollama/Modelfile.stt|sum|coach), CPU-близнецы — `create-phase2-cpu`
# (ollama/Modelfile.stt-cpu|sum-cpu|coach-cpu).
#
# temperature ОБЯЗАНА совпадать с `PARAMETER temperature` своего Modelfile:
# resolve_completion_params() (src/diary/domain/llm/providers.py) всегда
# отправляет temperature из профиля, поэтому расхождение — тихая подмена
# (Modelfile проигрывает). Согласование проверяет
# tests/unit/test_models_config.py; числа — из решения T02 (диапазоны брифа
# 0.1–0.2 / 0.2–0.3 / 0.4 задают границы выбора, в конфиг попадает одно число).
# У CPU-близнецов температура та же, что у GPU-тегов: устройство — не повод
# менять сэмплер.
#
# max_tokens — cap генерации, а не резерв VRAM (KV-кэш преаллоцируется под
# num_ctx). Запас нужен на канал reasoning: размышление тратит те же max_tokens,
# и при исчерпании лимита content приходит пустым (невалидный вывод = failed
# run). Поэтому у всех профилей явно стоит `reasoning_effort: none` (T02b,
# ADR-009) — канал размышлений выключен, лимит целиком уходит на ответ; поле
# опционально, и при его отсутствии провайдер не отправляет его вовсе
# (поведение по умолчанию не меняется).
#
# Бюджет окна (T20): `промпт + вход + max_tokens <= num_ctx` — это обязательство
# слоёв, а не пожелание. Оценка промпта берётся из самого файла промпта
# (2.5 символа/токен, `eval/run.py`) и у слоёв недели и коуча проверяется
# **перед** вызовом модели. Числа по измерению T20: промпт правки 1509, дня
# 2124, недели 3132, коуча 4113 оценённых токенов при окне 8192. Отсюда
# `diary_coach.max_tokens: 2048`, а не прежние общие 4096: при 4096 промпт и
# лимит генерации вместе (8209) не помещались в окно ещё до входа, то есть
# проверка проходила только из-за заниженной константы. Заметка коуча по
# контракту коротка (3 наблюдения + 2 гипотезы + короткий эксперимент; живой
# прогон T07 дал ~200 токенов), 2048 оставляет десятикратный запас и ~2000
# оценённых токенов на недельную сводку. Менять любое из чисел — значит
# перепроверять бюджет: у недельного слоя тот же гейт считает
# `num_ctx - max_tokens` как доступное входу (T06), у коуча — то же правило.
#
# num_ctx здесь НЕ задаётся: контекст — свойство созданной модели
# (`PARAMETER num_ctx 8192` в Modelfile), OpenAI-совместимый API Ollama его не
# принимает (docs/tasklist-phase2.md §5, §9.9).
#
# api_key_env указывает на имя переменной; значение Ollama НЕ проверяет
# (проверено), но приложение отклоняет пустое значение — ключ должен быть
# непустым (любая строка), иначе профиль считается неготовым.
#
# ГИБРИД (T13b, правило): интерактивные слои — на GPU, фоновая неделя — на CPU.
# День, правка STT и заметка коуча отвечают пользователю в UI, поэтому их теги
# остаются GPU (`diary-stt`/`diary-sum`/`diary-coach`, 2–10 с на операцию по
# замерам T13). Недельная сводка запускается фоново (её никто не ждёт в UI) и
# там же самый тяжёлый вход, поэтому её тег — CPU-близнец `diary-sum-cpu`:
# 36–127 с на операцию, зато VRAM не занимается вовсе, и Whisper может жить
# резидентно на GPU (docs/device-choice.md §6, §11). Поэтому у недельного
# профиля `timeout_s: 600`, а не 120: дефолт обрезал бы легитимный CPU-вызов
# (измеренный максимум — 126.5 с, docs/device-choice.md §4.3).

  diary_stt:
    provider: openai_compatible
    base_url: http://127.0.0.1:11434/v1
    model: diary-stt
    api_key_env: OLLAMA_API_KEY
    timeout_s: 120
    temperature: 0.15                      # == PARAMETER temperature в ollama/Modelfile.stt
    max_tokens: 3072
    reasoning_effort: none                 # канал размышлений выключен (T02b, ADR-009)
    external: false

  diary_sum:
    provider: openai_compatible
    base_url: http://127.0.0.1:11434/v1
    model: diary-sum
    api_key_env: OLLAMA_API_KEY
    timeout_s: 120
    temperature: 0.25                      # == PARAMETER temperature в ollama/Modelfile.sum
    max_tokens: 4096
    reasoning_effort: none                 # канал размышлений выключен (T02b, ADR-009)
    external: false

  diary_week:
    provider: openai_compatible
    base_url: http://127.0.0.1:11434/v1
    model: diary-sum-cpu                   # CPU-близнец: неделя считается в RAM (T13b)
    api_key_env: OLLAMA_API_KEY
    timeout_s: 600                         # CPU-неделя до ~127 с; дефолт 120 с её обрезал
    temperature: 0.25                      # == PARAMETER temperature в ollama/Modelfile.sum-cpu
    max_tokens: 4096
    reasoning_effort: none                 # канал размышлений выключен (T02b, ADR-009)
    external: false

  diary_coach:
    provider: openai_compatible
    base_url: http://127.0.0.1:11434/v1
    model: diary-coach
    api_key_env: OLLAMA_API_KEY
    timeout_s: 120
    temperature: 0.4                       # == PARAMETER temperature в ollama/Modelfile.coach
    max_tokens: 2048                       # T20: при 4096 промпт (4113) и лимит не влезали в окно
    reasoning_effort: none                 # канал размышлений выключен (T02b, ADR-009)
    external: false
