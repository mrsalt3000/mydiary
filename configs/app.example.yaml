# configs/app.example.yaml — справочный пример параметров приложения (Task 03).
#
# ВАЖНО: это НЕ загружаемый конфиг. Параметры приложения читаются из
# переменных окружения и локального файла .env (Pydantic Settings, префикс
# APP_) — см. configs/README.md. Файл ниже — документирующий пример для
# человека; реальная загрузка через env/.env, а не через YAML.
#
# Секретов в этом файле нет и быть не должно.

# Часовой пояс приложения (IANA). Невалидное имя — ошибка конфигурации при старте.
APP_TIMEZONE: Europe/Moscow

# Корень данных приложения (по умолчанию <репозиторий>/data).
# Все значения каталогов по умолчанию — подкаталоги этого корня.
APP_DATA_ROOT: /path/to/local/diary-data

# Каталоги данных (опционально; по умолчанию — подкаталоги APP_DATA_ROOT).
# APP_DB_DIR:      <APP_DATA_ROOT>/db        # SQLite-файл приложения
# APP_AUDIO_DIR:   <APP_DATA_ROOT>/audio     # голосовые сообщения (YYYY/MM/)
# APP_EXPORTS_DIR: <APP_DATA_ROOT>/exports   # недельные выгрузки и производные слои
# APP_TEMP_DIR:    <APP_DATA_ROOT>/temp      # временные файлы (очистка по политике)
# APP_BACKUPS_DIR: <APP_DATA_ROOT>/backups   # архивы бэкапов
#
# Правило (T38): явно заданный каталог сохраняет ровно то значение, которое ему
# дали, — даже если оно совпадает со значением по умолчанию; за APP_DATA_ROOT
# следуют только незаданные каталоги.

# Очистка временного каталога (Task 18): `python -m diary.cli backup
# --clean-temp` удаляет файлы внутри APP_TEMP_DIR старше этого порога (сек).
# Автоматически очищается только data/temp — аудио, выгрузки, бэкапы и БД
# не затрагиваются.
# APP_TEMP_RETENTION_S: 86400
