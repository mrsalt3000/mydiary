# Alembic configuration for Local Diary (Task 04).
#
# The database URL is intentionally NOT set here: alembic/env.py resolves it at
# runtime from ``AppSettings`` (``APP_DB_DIR``, default ``data/db/diary.db``).
# Override it for special runs with the ``ALEMBIC_DATABASE_URL`` or
# ``TEST_DATABASE_URL`` environment variables.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is computed in alembic/env.py; do not set it here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
