[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diary"
version = "0.1.0"
description = "Local Diary — local-first personal diary application for WSL 2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.5",
]
# Optional local speech-to-text runtime (Task 09): heavier native dependency.
# It is NOT installed by default or in CI — transcription is triggered through
# the provider abstraction, and a worker only needs faster-whisper when a
# transcribe_audio job actually runs (see README "Транскрипция на CPU").
stt = [
    "faster-whisper>=1.0",
]
# Optional local NLI validation runtime (T24): a small Russian ONNX cross-encoder
# that checks whether a summary claim is supported by the source it was written
# from. Like the STT extra it is NOT installed by default or in CI — the rules run
# with a scripted judge there, and the weights live outside the repository
# (scripts/fetch-nli-model.sh). faster-whisper already pulls both packages
# transitively; naming them here is what makes the dependency ours rather than
# borrowed, and it is what the adapter reports when the extra is missing.
# Analysis, measurements and the decision behind it: docs/nli-validation-analysis.md.
nli = [
    "onnxruntime>=1.14,<2",
    "tokenizers>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src"]

# Optional extras (``stt``, ``nli``) are not installed in CI and ship no type
# information: the adapters import them lazily and raise a typed error when the
# extra is missing, so mypy is told not to look inside.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true
